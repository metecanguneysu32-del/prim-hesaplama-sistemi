<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mağazalar | Prim Hesaplama Sistemi</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

    <style>

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .page-header h1 {
            margin: 0 0 6px;
            color: #111827;
            font-size: 28px;
        }

        .page-header p {
            margin: 0;
            color: #6b7280;
            font-size: 14px;
        }

        .back-button {
            text-decoration: none;
            padding: 10px 16px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background: #ffffff;
            color: #374151;
            font-size: 14px;
            font-weight: 600;
        }

        .back-button:hover {
            background: #f9fafb;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding: 18px;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
        }

        .search-box {
            flex: 1;
            max-width: 500px;
        }

        .search-box input {
            width: 100%;
            height: 42px;
            padding: 0 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .refresh-button {
            height: 42px;
            padding: 0 18px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .refresh-button:hover {
            background: #1d4ed8;
        }

        .table-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            overflow: hidden;
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 20px;
            border-bottom: 1px solid #e5e7eb;
        }

        .table-header h2 {
            margin: 0;
            font-size: 17px;
            color: #111827;
        }

        .store-count {
            color: #6b7280;
            font-size: 13px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            padding: 13px 15px;
            text-align: left;
            background: #f9fafb;
            border-bottom: 1px solid #e5e7eb;
            color: #374151;
            font-size: 13px;
        }

        td {
            padding: 14px 15px;
            border-bottom: 1px solid #f3f4f6;
            color: #374151;
            font-size: 14px;
        }

        tbody tr:hover {
            background: #f9fafb;
        }

        .status {
            display: inline-block;
            padding: 4px 9px;
            border-radius: 20px;
            background: #dcfce7;
            color: #166534;
            font-size: 12px;
            font-weight: 600;
        }

        .empty-message {
            padding: 45px 20px;
            text-align: center;
            color: #6b7280;
        }

        .error-message {
            margin: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
        }

        .loading-message {
            padding: 45px 20px;
            text-align: center;
            color: #6b7280;
        }

        @media (max-width: 700px) {

            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .search-box {
                max-width: none;
            }

        }

    </style>

</head>


<body>

<div class="container">

    <!-- =========================================
         BAŞLIK
         ========================================= -->

    <header class="page-header">

        <div>

            <h1>
                Mağazalar
            </h1>

            <p>
                Sistemde kayıtlı mağazaları görüntüleyin.
            </p>

        </div>

        <a
            href="/dashboard"
            class="back-button"
        >
            ← Dashboard
        </a>

    </header>


    <!-- =========================================
         ARAMA / YENİLE
         ========================================= -->

    <section class="toolbar">

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Mağaza kodu, mağaza adı, il veya ilçe ara..."
            >

        </div>

        <button
            type="button"
            class="refresh-button"
            id="refreshButton"
        >
            Yenile
        </button>

    </section>


    <!-- =========================================
         TABLO
         ========================================= -->

    <section class="table-card">

        <div class="table-header">

            <h2>
                Mağaza Listesi
            </h2>

            <span
                class="store-count"
                id="storeCount"
            >
                0 mağaza
            </span>

        </div>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            Mağaza Kodu
                        </th>

                        <th>
                            Mağaza Adı
                        </th>

                        <th>
                            İl
                        </th>

                        <th>
                            İlçe
                        </th>

                        <th>
                            Mahalle
                        </th>

                        <th>
                            Durum
                        </th>

                    </tr>

                </thead>

                <tbody id="storesTableBody">

                    <tr>

                        <td
                            colspan="6"
                            class="loading-message"
                        >
                            Mağazalar yükleniyor...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </section>

</div>


<script>

    let allStores = [];


    // ==================================================
    // MAĞAZALARI GETİR
    // ==================================================

    async function loadStores() {

        const tableBody =
            document.getElementById(
                "storesTableBody"
            );

        const storeCount =
            document.getElementById(
                "storeCount"
            );

        tableBody.innerHTML = `
            <tr>
                <td
                    colspan="6"
                    class="loading-message"
                >
                    Mağazalar yükleniyor...
                </td>
            </tr>
        `;

        try {

            const response =
                await fetch(
                    "/api/stores",
                    {
                        method: "GET",
                        headers: {
                            "Accept":
                                "application/json"
                        }
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Sunucu hatası: HTTP " +
                    response.status
                );

            }


            const data =
                await response.json();


            console.log(
                "API cevabı:",
                data
            );


            if (
                !data ||
                data.success !== true
            ) {

                throw new Error(
                    data &&
                    data.message
                        ? data.message
                        : "Mağaza verisi alınamadı."
                );

            }


            /*
             * Flask API:
             *
             * {
             *   success: true,
             *   stores: [...]
             * }
             */

            allStores =
                Array.isArray(data.stores)
                    ? data.stores
                    : [];


            renderStores(
                allStores
            );


        } catch (error) {

            console.error(
                "Mağaza yükleme hatası:",
                error
            );


            storeCount.textContent =
                "0 mağaza";


            tableBody.innerHTML = `
                <tr>
                    <td colspan="6">

                        <div class="error-message">

                            Mağazalar yüklenemedi.

                            <br><br>

                            Hata:
                            ${escapeHtml(
                                error.message
                            )}

                        </div>

                    </td>
                </tr>
            `;

        }

    }


    // ==================================================
    // MAĞAZALARI TABLOYA BAS
    // ==================================================

    function renderStores(
        stores
    ) {

        const tableBody =
            document.getElementById(
                "storesTableBody"
            );

        const storeCount =
            document.getElementById(
                "storeCount"
            );


        storeCount.textContent =
            stores.length +
            " mağaza";


        if (
            !stores ||
            stores.length === 0
        ) {

            tableBody.innerHTML = `
                <tr>
                    <td
                        colspan="6"
                        class="empty-message"
                    >
                        Kayıtlı mağaza bulunamadı.
                    </td>
                </tr>
            `;

            return;

        }


        tableBody.innerHTML =
            stores.map(
                function(store) {

                    return `

                        <tr>

                            <td>
                                ${escapeHtml(
                                    store.store_code || ""
                                )}
                            </td>

                            <td>
                                ${escapeHtml(
                                    store.store_name || ""
                                )}
                            </td>

                            <td>
                                ${escapeHtml(
                                    store.city || ""
                                )}
                            </td>

                            <td>
                                ${escapeHtml(
                                    store.district || ""
                                )}
                            </td>

                            <td>
                                ${escapeHtml(
                                    store.neighborhood || ""
                                )}
                            </td>

                            <td>

                                <span class="status">
                                    Aktif
                                </span>

                            </td>

                        </tr>

                    `;

                }
            ).join("");

    }


    // ==================================================
    // ARAMA
    // ==================================================

    function filterStores() {

        const searchInput =
            document.getElementById(
                "searchInput"
            );

        const search =
            searchInput.value
                .trim()
                .toLocaleLowerCase(
                    "tr-TR"
                );


        if (!search) {

            renderStores(
                allStores
            );

            return;

        }


        const filtered =
            allStores.filter(
                function(store) {

                    const values = [

                        store.store_code,
                        store.store_name,
                        store.city,
                        store.district,
                        store.neighborhood

                    ];


                    return values.some(
                        function(value) {

                            return String(
                                value || ""
                            )
                            .toLocaleLowerCase(
                                "tr-TR"
                            )
                            .includes(
                                search
                            );

                        }
                    );

                }
            );


        renderStores(
            filtered
        );

    }


    // ==================================================
    // HTML GÜVENLİĞİ
    // ==================================================

    function escapeHtml(
        value
    ) {

        return String(
            value || ""
        )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

    }


    // ==================================================
    // OLAYLAR
    // ==================================================

    document
        .getElementById(
            "refreshButton"
        )
        .addEventListener(
            "click",
            loadStores
        );


    document
        .getElementById(
            "searchInput"
        )
        .addEventListener(
            "input",
            filterStores
        );


    // ==================================================
    // SAYFA AÇILDIĞINDA
    // ==================================================

    document.addEventListener(
        "DOMContentLoaded",
        function() {

            loadStores();

        }
    );

</script>

</body>

</html>
